spring.application.name=todos

# --- Server ---
server.port=${PORT:8080}
# Return RFC 9457 "application/problem+json" error responses
spring.mvc.problemdetails.enabled=true
# Respect X-Forwarded-* headers when running behind a reverse proxy / load balancer
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Java 25: serve requests on virtual threads
spring.threads.virtual.enabled=true

# --- Datasource (override via env vars outside local dev; Testcontainers overrides these in tests) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/todos}
spring.datasource.username=${DB_USERNAME:todos}
spring.datasource.password=${DB_PASSWORD:todos}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
# Don't keep DB connections open for the whole web request (avoids lazy-loading in controllers)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Flyway ---
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# --- Security: OAuth2 resource server (JWT) ---
# OpenID Connect issuer; must match the tokens' `iss` claim. Required: no default, so it never ends up in the repo.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
# Only accept tokens issued for this API (the API/resource identifier registered at the issuer)
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:https://api.todos.local}
# Signature algorithms the issuer may use (EC and RSA keys). Spring's default is RS256 only.
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES384,RS256

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# --- OpenAPI / Swagger UI (disable in production with API_DOCS_ENABLED=false) ---
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
# Stable, readable output so the committed openapi.json only changes when the API does
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
# Endpoints return JSON; without this the spec says */*
springdoc.default-produces-media-type=application/json
