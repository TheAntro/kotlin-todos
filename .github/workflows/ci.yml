# Runs on every PR (opened, updated, reopened) and on pushes to main.
# Tool versions come from mise.toml, and the steps call the same mise tasks you run locally.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the run for the previous commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: java

      # Caches Gradle dependencies and the wrapper between runs
      - uses: gradle/actions/setup-gradle@v6

      - name: Lint + format check
        run: mise run backend:check

      # Testcontainers uses the Docker daemon that ships with the runner
      - name: Test
        run: mise run backend:test

  frontend:
    name: Frontend (check + typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm

      # pnpm installs with --frozen-lockfile automatically when CI=true
      - name: Install dependencies
        run: mise run frontend:install

      - name: Lint + format check
        run: mise run frontend:check

      # The client is generated from apps/backend/openapi.json (which the backend tests keep in sync with the code)
      - name: Generated API client is up to date
        run: |
          pnpm generate:api
          if [ -n "$(git status --porcelain -- src/api/generated)" ]; then
            echo "::error::src/api/generated is out of date; run 'mise run api:generate' and commit the result"
            exit 1
          fi
        working-directory: apps/frontend

      - name: Typecheck
        run: mise run frontend:typecheck

      - name: Unit tests
        run: mise run frontend:test

      - name: Build
        run: pnpm build
        working-directory: apps/frontend

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Signs in with a real Logto test user, so it needs these repo secrets and a runner that
    # can reach Logto. Secrets aren't available to PRs from forks, so this job fails there.
    env:
      JWT_ISSUER_URI: ${{ secrets.JWT_ISSUER_URI }}
      LOGTO_ENDPOINT: ${{ secrets.LOGTO_ENDPOINT }}
      LOGTO_APP_ID: ${{ secrets.LOGTO_APP_ID }}
      LOGTO_APP_SECRET: ${{ secrets.LOGTO_APP_SECRET }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: |
          mise run e2e:install
          pnpm exec playwright install-deps chromium
        working-directory: e2e

      - name: Lint + typecheck
        run: mise run e2e:check

      # The production images, as in `mise run stack:up`; compose reads the env vars above
      - name: Start the stack
        run: docker compose --profile app up --detach --build --wait

      - name: Wait for the app
        run: |
          curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/actuator/health
          curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors --output /dev/null http://localhost:3000/

      - name: E2E tests
        run: mise run e2e:test

      - name: Stack logs
        if: failure()
        run: docker compose --profile app logs

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  docker:
    name: Docker image (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only; nothing is pushed until we add a deploy step
      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.app }}
          push: false
          tags: kotlin-todos-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
