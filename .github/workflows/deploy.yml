# Deploys to staging on every push to main. See docs/deployment/plan.md.
# Every job runs in the `staging` GitHub environment, whose variables and secrets it uses and which
# only `main` can deploy to. GitHub Actions signs in to GCP with Workload Identity Federation, so
# there are no service account keys.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once, and never cut off a running one
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGION: europe-north1 # region in infra/envs/staging.tfvars
  REGISTRY_HOST: europe-north1-docker.pkg.dev

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'

  # Runs only when infra/ changed, or on manual dispatch (to retry a failed apply).
  # No plan review: acceptable for staging; production will review the plan first.
  infra:
    name: Terraform apply
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write # for the GitHub OIDC token that WIF exchanges
    defaults:
      run:
        working-directory: infra
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_jwt_issuer_uri: ${{ secrets.JWT_ISSUER_URI }}
      TF_VAR_logto_endpoint: ${{ secrets.LOGTO_ENDPOINT }}
      TF_VAR_logto_app_id: ${{ secrets.LOGTO_APP_ID }}
      TF_VAR_logto_app_secret: ${{ secrets.LOGTO_APP_SECRET }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: terraform

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_SA }}

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -var-file=envs/staging.tfvars

  # The jobs below run as deployer@, which can't read Terraform state, so they derive what they
  # need: registry europe-north1-docker.pkg.dev/<project>/images, services `backend`/`frontend`.
  # Building runs third-party build code (Gradle plugins, npm packages), so never as terraform@.
  build:
    name: Build ${{ matrix.service }}
    needs: infra
    # Also after a skipped infra job (no infra/ changes), but not after a failed one
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Build and push
        env:
          IMAGE: ${{ env.REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/images/${{ matrix.service }}:${{ github.sha }}
        run: |
          gcloud auth configure-docker "$REGISTRY_HOST" --quiet
          docker build -t "$IMAGE" "apps/${{ matrix.service }}"
          docker push "$IMAGE"

  # Runs the just-built backend image without its web server and with Flyway on, against Neon's
  # direct (non-pooler) endpoint; the app exits once migrated (non-zero if it fails). JWT_ISSUER_URI
# only has to resolve: nothing validates tokens without the web server. The old revision keeps serving
  # against the new schema until deploy, so migrations must be backward-compatible.
  migrate:
    name: Migrate database
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Run Flyway
        env:
          IMAGE: ${{ env.REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/images/backend:${{ github.sha }}
          DB_USERNAME: todos # role_name in infra/main.tf
        run: |
          DB_URL="$(gcloud secrets versions access latest --secret=migrate-db-url)"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=backend-db-password)"
          echo "::add-mask::$DB_URL"
          echo "::add-mask::$DB_PASSWORD"
          export DB_URL DB_PASSWORD
          gcloud auth configure-docker "$REGISTRY_HOST" --quiet
          docker run --rm \
            -e DB_URL -e DB_USERNAME -e DB_PASSWORD \
            -e SPRING_MAIN_WEB_APPLICATION_TYPE=none \
            -e SPRING_FLYWAY_ENABLED=true \
            -e JWT_ISSUER_URI=https://unused.invalid \
            "$IMAGE"

  # Changes only the image; Terraform owns everything else about the services.
  # Each update waits until the new revision passes its startup probe.
  deploy:
    name: Deploy
    needs: migrate
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.todos.antro.dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Deploy backend, then frontend
        run: |
          for service in backend frontend; do
            gcloud run services update "$service" \
              --region "$REGION" \
              --image "$REGISTRY_HOST/${{ vars.GCP_PROJECT_ID }}/images/$service:${{ github.sha }}" \
              --quiet
          done

  # Playwright against staging, signing in with the real Logto test user. The tests create their
  # own uniquely named data, so what piles up in staging is harmless.
  e2e:
    name: E2E against staging
    needs: deploy
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      E2E_BASE_URL: https://staging.todos.antro.dev
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: |
          mise run e2e:install
          pnpm exec playwright install-deps chromium
        working-directory: e2e

      # The new revisions passed their startup probes in deploy; this just fails fast if the site is down
      - name: Check the site is up
        run: curl --fail --silent --retry 10 --retry-delay 3 --retry-all-errors --output /dev/null "$E2E_BASE_URL/"

      - name: E2E tests
        run: mise run e2e:test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-staging
          path: e2e/playwright-report/
          retention-days: 14
