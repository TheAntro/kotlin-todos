# Toolchain + dev tasks. Get started with:
#   mise install
#   mise run setup
#   mise run dev
#
# List all tasks with `mise tasks`.

[tools]
java = "temurin-25.0.5+8.0.LTS" # keep in sync with apps/backend/Dockerfile
node = "26.12.1"                # keep in sync with apps/frontend/Dockerfile
pnpm = "12.16.1"
lefthook = "2.2.2"
terraform = "1.17.2"

# Local settings and secrets from the gitignored .env (see .env.example); it's fine if the file is missing
[env]
_.file = ".env"

# ---------- Setup ----------

[tasks.setup]
description = "Install git hooks, frontend and e2e deps, pre-fetch backend dependencies"
depends = ["hooks:install", "frontend:install", "e2e:install"]
dir = "{{config_root}}/apps/backend"
run = "./gradlew --quiet dependencies > /dev/null"

[tasks."hooks:install"]
description = "Install the git hooks from lefthook.yml"
run = "lefthook install"

[tasks."frontend:install"]
description = "Install frontend dependencies"
dir = "{{config_root}}/apps/frontend"
run = "pnpm install"

[tasks."e2e:install"]
description = "Install e2e test dependencies and the Playwright browser"
dir = "{{config_root}}/e2e"
run = ["pnpm install", "pnpm exec playwright install chromium"]

# ---------- API contract ----------

[tasks."api:generate"]
description = "Update the backend's openapi.json and regenerate the frontend API client from it"
run = [
  "cd apps/backend && UPDATE_OPENAPI_SPEC=true ./gradlew --quiet test --tests dev.antro.todos.OpenApiSpecTest --rerun",
  "cd apps/frontend && pnpm generate:api",
]

# ---------- Database ----------

[tasks."db:up"]
description = "Start Postgres and wait until it's healthy"
run = "docker compose up -d --wait postgres"

[tasks."db:down"]
description = "Stop Postgres (data is kept)"
run = "docker compose stop postgres"

[tasks."db:reset"]
description = "Delete all local DB data and start a fresh Postgres"
run = [
  "docker compose rm -sf postgres",
  "docker volume rm -f kotlin-todos_postgres-data",
  "docker compose up -d --wait postgres",
]

[tasks."db:psql"]
description = "Open a psql shell in the local database"
raw = true
run = "docker compose exec postgres psql -U todos -d todos"

# ---------- Development (hot reload) ----------

[tasks.dev]
description = "Run Postgres, backend and frontend with hot reload"
depends = ["backend:dev", "frontend:dev"]

[tasks."backend:dev"]
description = "Run the Spring Boot backend; recompiles on change and DevTools restarts it"
depends = ["db:up"]
dir = "{{config_root}}/apps/backend"
run = '''
#!/usr/bin/env bash
set -euo pipefail
./gradlew --quiet classes
# Continuous compile in the background; DevTools picks up the new classes and restarts the app
./gradlew --quiet --continuous classes &
trap 'kill $! 2>/dev/null' EXIT
./gradlew bootRun
'''

[tasks."frontend:dev"]
description = "Run the Vite dev server with HMR"
dir = "{{config_root}}/apps/frontend"
run = "pnpm dev"

# ---------- Full stack in Docker (production images) ----------

[tasks."stack:up"]
description = "Build and run the whole stack in Docker using the production Dockerfiles"
run = "docker compose --profile app up --build"

[tasks."stack:down"]
description = "Stop the whole Docker stack"
run = "docker compose --profile app down"

# ---------- Checks ----------

[tasks.test]
description = "Run backend and frontend tests in parallel (not e2e, which needs a running app)"
depends = ["backend:test", "frontend:test"]

[tasks."backend:test"]
description = "Run backend tests (uses Testcontainers, so Docker must be running)"
dir = "{{config_root}}/apps/backend"
run = "./gradlew test"

[tasks."backend:check"]
description = "Lint + format check the backend (ktlint via Spotless, detekt)"
dir = "{{config_root}}/apps/backend"
run = "./gradlew spotlessCheck detekt"

[tasks."backend:format"]
description = "Format the backend with ktlint"
dir = "{{config_root}}/apps/backend"
run = "./gradlew spotlessApply"

[tasks."frontend:check"]
description = "Lint + format check the frontend"
dir = "{{config_root}}/apps/frontend"
run = "pnpm check"

[tasks."frontend:test"]
description = "Run frontend unit tests (Vitest)"
dir = "{{config_root}}/apps/frontend"
run = "pnpm test"

[tasks."frontend:typecheck"]
description = "Type-check the frontend with tsc"
dir = "{{config_root}}/apps/frontend"
run = "pnpm typecheck"

# ---------- Infrastructure (Terraform) ----------

[tasks."infra:fmt"]
description = "Format the Terraform code"
run = "terraform fmt -recursive infra"

[tasks."infra:validate"]
description = "Format check and validate the Terraform code (no state or credentials needed)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
terraform fmt -check -recursive infra
for dir in infra/bootstrap infra; do
  terraform -chdir="$dir" init -backend=false -input=false > /dev/null
  terraform -chdir="$dir" validate
done
'''

# ---------- End-to-end tests (Playwright) ----------
# Run against an already running app (`mise run dev` or `mise run stack:up`).

[tasks."e2e:test"]
description = "Run the Playwright e2e tests against the running app"
dir = "{{config_root}}/e2e"
run = "pnpm test"

[tasks."e2e:ui"]
description = "Open Playwright's UI mode to run and debug e2e tests"
dir = "{{config_root}}/e2e"
raw = true
run = "pnpm test:ui"

[tasks."e2e:check"]
description = "Lint, format check and type-check the e2e tests"
dir = "{{config_root}}/e2e"
run = ["pnpm check", "pnpm typecheck"]
